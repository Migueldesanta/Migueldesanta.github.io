about_content: |
  I am a recent graduate of Penn State University with a dual major in Statistics and Political Science. My primary skill is <mark>R</mark> (especially R Shiny) for data analysis and visualization.  

  My academic interests focus on <mark>public opinion</mark>, <mark>voting behavior</mark>, and the related <mark>statistical methodology</mark>. Recently, I have also been exploring the applications of <mark>large language models (LLMs)</mark> in the social sciences, particularly in political research.

