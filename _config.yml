# ─── Site ────────────────────────────────────────────────────────
title: "Xin (Michael) Yun"
tagline: "Quantitative research portfolio"
description: "Working paper series and selected projects in causal inference, macro markets, and computational social science."
url: "https://migueldesanta.github.io"
baseurl: ""

# ─── Author ──────────────────────────────────────────────────────
author:
  name: "Xin (Michael) Yun"
  email: yun.xin@outlook.com
  linkedin: xinyun5160
  github: Migueldesanta
  location: "Hong Kong"

# ─── Build ───────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections — each paper is a separate file in _papers/
collections:
  papers:
    output: true
    permalink: /papers/:path/
    sort_by: order

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ─── Plugins ─────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag

# ─── Exclusions ──────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - node_modules/
